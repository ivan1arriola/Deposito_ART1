name: Strict Quality Gates

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality-gates:
    name: Typecheck, Lint, Format, Arch, Knip, Spanish & 90% Coverage
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/deposito_art1_ci"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: TypeScript strict check
        run: npm run typecheck

      - name: ESLint (zero warnings)
        run: npm run lint

      - name: Prettier format check
        run: npm run format:check

      - name: Dependency Cruiser architecture check
        run: npm run dep:check

      - name: Knip dead code check
        run: npm run knip

      - name: UTF-8 and Spanish integrity
        run: npm run check:encoding && npm run check:spanish

      - name: Refactor risk and security hygiene gates
        run: npm run refactor:gate && npm run check:security

      - name: Vitest suite with 90% coverage threshold
        run: npx vitest run --coverage
